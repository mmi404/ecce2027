# Pinned Hyperparameters for YOLOv8s Training (ECCE 2027 Transfer Study)
# Pinned seed: 42, deterministic: True, fixed epochs: 100, patience: 0 (no early stopping)
# Exact pinned ultralytics version: 8.4.155

ultralytics_version: 8.4.155
model: yolov8s.pt
epochs: 100
patience: 0
batch: 16
imgsz: 640
save: True
cache: False
device: 0
workers: 4
optimizer: SGD
seed: 42
deterministic: True
close_mosaic: 10

# Optimization parameters
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentation settings
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
